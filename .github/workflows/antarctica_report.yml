name: Antarctica Report

on:
  schedule:
    # ۷:۰۰ صبح تهران (کتاب + معرفی ایستگاه)
    - cron: '30 3 * * *'
    # ۸:۰۰ صبح تهران (مقاله علمی)
    - cron: '30 4 * * *'
    # ۱۰:۰۰ صبح تهران (اخبار)
    - cron: '30 6 * * *'
    # ۱۱:۰۰ صبح تهران (آب‌وهوا + فعالیت‌ها)
    - cron: '30 7 * * *'
    # ۱۰:۰۰ شب تهران (اخبار)
    - cron: '30 18 * * *'
    # ۱۱:۰۰ شب تهران (آب‌وهوا)
    - cron: '30 19 * * *'
    # هر ساعت (برای هشدارهای فوری و داده‌های علمی)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv python-telegram-bot jdatetime
      - name: Send report
        env:
          ANTARCTICA_TELEGRAM_TOKEN: ${{ secrets.ANTARCTICA_TELEGRAM_TOKEN }}
          ANTARCTICA_BALE_TOKEN: ${{ secrets.ANTARCTICA_BALE_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python antarctica_report.py