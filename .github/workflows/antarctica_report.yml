name: Antarctica Report

on:
  schedule:
    # ۷:۰۰ صبح تهران (برای کتاب و معرفی ایستگاه)
    - cron: '30 3 * * *'
    # ۸:۰۰ صبح تهران (برای مقاله علمی)
    - cron: '30 4 * * *'
    # ۱۰:۳۰ صبح تهران (برای اخبار)
    - cron: '0 7 * * *'
    # ۱۱:۰۰ صبح تهران (برای آب‌وهوا + فعالیت‌ها)
    - cron: '30 7 * * *'
    # ۱۰:۳۰ شب تهران (برای اخبار)
    - cron: '0 19 * * *'
    # ۱۱:۰۰ شب تهران (برای آب‌وهوا + فعالیت‌ها)
    - cron: '30 19 * * *'
    # هر ساعت (برای هشدار طوفان و داده‌های علمی)
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-dotenv python-telegram-bot jdatetime
      - name: Send report
        env:
          ANTARCTICA_TELEGRAM_TOKEN: ${{ secrets.ANTARCTICA_TELEGRAM_TOKEN }}
          ANTARCTICA_BALE_TOKEN: ${{ secrets.ANTARCTICA_BALE_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python antarctica_report.py